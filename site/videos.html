<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>全部期数 · 初2028届2班新闻电台</title>
  <meta name="description" content="初2028届2班新闻电台全部视频归档。" />
  <meta name="theme-color" content="#0a0a16" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:title" content="全部期数 · 初2028届2班新闻电台" />
  <meta property="og:description" content="42期班级新闻播报，点击即可观看。" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-v72.css" />
</head>
<body>
  <div id="top-tape"></div>
  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <span class="dot"></span>
        <div>新闻电台<small>CLASS NEWS · 初2028届 · 2班</small></div>
      </div>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="videos.html" class="active">全部期数</a>
        <a href="index.html#about">关于</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="section" style="padding-top:44px;">
      <div class="sec-row">
        <div>
          <h3>全部期数</h3>
          <div class="hint">按时间倒序排列 · 点击封面即可观看</div>
        </div>
        <div class="view-toggle" id="viewToggle" role="tablist" aria-label="切换版式">
          <button type="button" class="vt-btn active" data-view="mflow" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="6" height="6" rx="1"/><rect x="4" y="15" width="5" height="6" rx="1"/><rect x="14" y="3" width="6" height="10" rx="1"/><rect x="14" y="17" width="6" height="4" rx="1"/></svg>瀑布</button>
          <button type="button" class="vt-btn" data-view="vgrid" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>整齐</button>
        </div>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" class="search-input" placeholder="搜索视频（标题 / 主播 / 简介 / 期号）" autocomplete="off" />
      </div>
      <div class="stage mflow" id="list"><!-- poster 由 videos.js 数据渲染 --></div>
    </section>
  </main>

  <div class="feedback-bar">
    <a href="#guestbook" onclick="setTimeout(function(){var t=document.getElementById('gb-text');if(t)t.focus();},300)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> 问题建议反馈</a>
  </div>

  <div id="guestbook" class="guestbook-slot">
    <div class="gb-head">
      <h3>班级留言板</h3>
      <p class="hint">写下你想对班级说的话，大家一起看～</p>
    </div>
    <form id="gb-form" class="gb-form">
      <input id="gb-name" type="text" maxlength="20" placeholder="你的昵称（选填，留空则显示为「匿名」）" autocomplete="off" />
      <textarea id="gb-text" rows="3" placeholder="说点什么…" required></textarea>
      <button type="submit">发送留言</button>
    </form>
    <div class="gb-list" id="gb-list"><!-- 由 guestbook.js 渲染列表 --></div>
  </div>

  <footer class="footer">
    <div class="wrap">初2028届2班 · 新闻电台 ｜ 班级内部交流用途，请勿外传 ｜ <a href="dashboard.html" style="color:var(--ink-soft);text-decoration:underline;">数据看板</a><span class="footer-issue">Class News Radio · Est. 2026</span></div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/guestbook.js"></script>
  <script>
    (async function () {
      var list = document.getElementById("list");
      var search = document.getElementById("search");
      var videos = window.VIDEOS || [];
      if (!videos.length) { list.innerHTML = '<p>暂无视频，敬请期待～</p>'; return; }

      function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
      function hostName(v){ return ((v.hosts||[])[0]||"").replace("主播：",""); }
      function noOf(id){ return (id.match(/\d+/)||["0"])[0]; }
      var counts = await Store.getAllCommentCounts();

      function poster(v) {
        var no = noOf(v.id).padStart(2, "0");
        var host = hostName(v);
        var title = v.title.replace(/^第\d+期 · /, "");
        return '<a class="poster reveal" href="play.html?id=' + v.id + '">' +
          '<div class="ph">' +
            '<span class="ep">第 ' + no + ' 期</span>' +
            '<img src="covers/' + v.id + '.webp" alt="' + esc(v.title) + '" loading="lazy" />' +
            '<span class="pl"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i></span>' +
          '</div>' +
          '<h3 class="ttl">' + esc(title) + '</h3>' +
          '<div class="pd">' +
            (host ? '<span class="nm">' + esc(host) + '</span><span class="ln"></span>' : '') +
            '<span>' + v.date + '</span>' +
            (counts && counts[v.id] ? '<span class="ln"></span><span>' + (counts[v.id]||0) + ' 评论</span>' : '') +
          '</div>' +
        '</a>';
      }

      function renderList(q) {
        q = (q || "").trim().toLowerCase();
        var arr = videos.filter(function (v) {
          if (!q) return true;
          var hay = (v.id + " " + v.title + " " + (v.hosts || []).join(" ") + " " + v.date + " " + v.desc).toLowerCase();
          return hay.indexOf(q) !== -1;
        });
        if (!arr.length) {
          list.innerHTML = '<p class="gb-empty" style="text-align:center;">没有找到匹配「' + Store.esc(q) + '」的视频。</p>';
          return;
        }
        list.innerHTML = arr.map(poster).join('');
        if (window.__revealInit) window.__revealInit(list, { instant: !!q });
      }

      // 当前版式（mflow 瀑布流 / vgrid 整齐网格）
      var curView = "mflow";
      function applyView(view) {
        curView = view;
        list.className = "stage " + view;
        var btns = document.querySelectorAll(".vt-btn");
        for (var i = 0; i < btns.length; i++) {
          var on = btns[i].getAttribute("data-view") === view;
          btns[i].className = "vt-btn" + (on ? " active" : "");
          btns[i].setAttribute("aria-selected", on ? "true" : "false");
        }
        renderList(search ? search.value : "");
      }
      renderList("");
      if (search) search.addEventListener("input", function () { renderList(search.value); });
      var toggle = document.getElementById("viewToggle");
      if (toggle) toggle.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".vt-btn") : null;
        if (!btn || !btn.getAttribute("data-view")) return;
        applyView(btn.getAttribute("data-view"));
      });
    })();
  </script>
</body>
</html>

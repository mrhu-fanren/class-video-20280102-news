<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>视频专区 · 初2028届2班新闻电台</title>
  <meta name="description" content="初2028届2班新闻电台全部视频归档。" />
  <meta name="theme-color" content="#16406b" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:title" content="视频专区 · 初2028届2班新闻电台" />
  <meta property="og:description" content="42期班级新闻播报，点击即可观看。" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <span class="dot"></span>
        <div>新闻电台<small>初2028届 · 2班</small></div>
      </div>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="videos.html">视频专区</a>
        <a href="index.html#about">关于</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="section">
      <h3>视频专区</h3>
      <div class="hint">按时间倒序排列，点击即可观看每一期班级新闻。</div>
      <div class="search-wrap">
        <input type="search" id="search" class="search-input" placeholder="搜索视频（标题 / 主播 / 简介 / 期号）" autocomplete="off" />
      </div>
      <div class="vlist" id="list"><!-- 由 videos.js 渲染 --></div>
    </section>
  </main>

  <div class="feedback-bar">
    <a href="#guestbook" onclick="setTimeout(function(){var t=document.getElementById('gb-text');if(t)t.focus();},300)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> 问题建议反馈</a>
  </div>

  <footer class="footer">
    <div class="wrap">初2028届2班 · 新闻电台 ｜ 班级内部交流用途，请勿外传 ｜ <a href="dashboard.html" style="color:var(--ink-soft);text-decoration:underline;">数据看板</a><span class="footer-issue">Class News Radio · Est. 2026</span></div>
  </footer>

  <div id="guestbook" style="max-width:960px;margin:0 auto 30px;padding:0 20px;"></div>

  <script src="js/store.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/guestbook.js"></script>
  <script>
    (async function () {
      var list = document.getElementById("list");
      var search = document.getElementById("search");
      var videos = window.VIDEOS || [];
      if (!videos.length) { list.innerHTML = '<p>暂无视频，敬请期待～</p>'; return; }
      var counts = await Store.getAllCommentCounts();
      function renderList(q) {
        q = (q || "").trim().toLowerCase();
        var arr = videos.filter(function (v) {
          if (!q) return true;
          var hay = (v.id + " " + v.title + " " + (v.hosts || []).join(" ") + " " + v.date + " " + v.desc).toLowerCase();
          return hay.indexOf(q) !== -1;
        });
        if (!arr.length) {
          list.innerHTML = '<p class="gb-empty">没有找到匹配「' + Store.esc(q) + '」的视频。</p>';
          return;
        }
        list.innerHTML = arr.map(function (v) {
          var no = (v.id.match(/\d+/) || ["0"])[0].padStart(2, "0");
          var host = ((v.hosts || [])[0] || "").replace("主播：", "");
          return '<a class="vcard" href="play.html?id=' + v.id + '">' +
            '<div class="cover">' +
              '<span class="no">' + no + '</span>' +
              (host ? '<span class="host-seal">' + host + '</span>' : '') +
              '<span class="play-ic"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>' +
            '</div>' +
            '<div class="vbody">' +
              '<div class="vtitle">' + v.title + '</div>' +
              '<div class="vmeta">' +
                '<span class="vdate">' + v.date + '</span>' +
                '<span class="vcomments"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> ' + (counts[v.id] || 0) + '</span>' +
              '</div>' +
            '</div>' +
          '</a>';
        }).join('');
      }
      renderList("");
      if (search) search.addEventListener("input", function () { renderList(search.value); });
    })();
  </script>
</body>
</html>
